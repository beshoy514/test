name: clean_ops
description: CleanOps mobile application.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  cupertino_icons: ^1.0.8
  equatable: ^3.0.0
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  go_router: ^17.5.0
  google_fonts: ^8.2.1
  shared_preferences: ^2.5.6
  get_it: ^9.3.0

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/images/brand/
    - assets/images/onboarding_community.png
    - assets/images/onboarding_report.png
    - assets/images/onboarding_trust.png
    - assets/images/splash_background.png
